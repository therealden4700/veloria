<!DOCTYPE html>
<!-- Язык страницы ставит сама игра: `initLang` пишет сюда выбранный, а по
     умолчанию английский. Здесь стоит то же умолчание, чтобы разметка не
     противоречила первому кадру. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="author" content="therealden4700">
<meta name="description" content="Veloria — a 2D pixel ARPG in the browser. Every sprite, sound and note is generated in code at load time.">
<meta name="copyright" content="© 2026 therealden4700">
<!-- Где стоит комната общего мира.
     Пусто — комната там же, откуда пришла страница: так работает `node
     server/server.js` на своей машине. Живая ссылка живёт на GitHub Pages, а это
     статика: вебсокетов она не отдаёт. Чтобы страница с Pages нашла общий мир,
     впишите сюда адрес сервера, например
     <meta name="veloria-server" content="https://veloria.fly.dev">
     Без адреса игра просто работает одиночно — это не поломка, а честный
     запасной путь. -->
<meta name="veloria-server" content="">
<title>Veloria</title>
<link rel="stylesheet" href="./styles.css">
</head>
<body>
  <div id="app">
    <!-- Мир рисуется в 480×270 и растягивается ×4 без сглаживания: так пиксель
         остаётся ровным квадратом. Интерфейс лежит отдельным слоем поверх и
         рисуется в настоящем разрешении экрана — оттого текст чёткий, а места
         под панели вчетверо больше. -->
    <div id="stack">
      <canvas id="game" width="480" height="270"></canvas>
      <canvas id="ui"></canvas>
    </div>
  </div>
  <div id="boot">
    <div class="logo">VELORIA</div>
    <!-- Первая надпись до того, как выполнится хоть одна строка кода. Дальше
         `main.js` заменит её переведённой — но первый кадр рисует браузер, и
         англичанину не должно достаться русское слово даже на миг. -->
    <div class="sub">forging the world…</div>
    <div class="bar"><i></i></div>
  </div>
  <div id="rotate">
    <div class="glyph"></div>
    <div class="t">TURN YOUR SCREEN</div>
    <div class="s">Veloria plays in landscape: the world is wider than it is tall.</div>
  </div>
  <div id="fatal" hidden></div>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
