# Комната Veloria на Fly.io.
#
# Что здесь важно и почему.
#
# Машина одна и не засыпает. Комната — это состояние: в ней стоят игроки, живут
# сроки возрождения, взведены лагеря, ждёт своего часа страж. Вторая копия
# означала бы второй мир по тому же адресу, а сон — что мир исчезает, едва все
# вышли, и возвращается с чистого листа.
#
# База лежит на томе, а не в образе: образ подменяется при каждом обновлении.

app = 'veloria'
primary_region = 'fra'

[build]
  dockerfile = 'Dockerfile'

[env]
  PORT = '8080'
  VELORIA_DB = '/data/veloria.db'
  # Кому позволено обращаться к комнате из браузера. Живая ссылка — на Pages,
  # и без этой строки браузер отбросит и вход, и сокет.
  VELORIA_ORIGINS = 'https://therealden4700.github.io'

[[mounts]]
  source = 'veloria_data'
  destination = '/data'

[http_service]
  internal_port = 8080
  force_https = true
  # Мир должен жить, когда в нём никого нет: сроки возрождения идут своим ходом,
  # а вернувшийся игрок должен застать биом таким, каким оставил.
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
  # Комната — состояние, и второй её быть не может: игроки оказались бы в разных
  # мирах по одному адресу.
  processes = ['app']

  [http_service.concurrency]
    type = 'connections'
    # Замер: полсотни в городе — 38,9 КБ/с каждому, такт ровный, память 113 МБ.
    # Выше не мерили, значит и не обещаем.
    hard_limit = 60
    soft_limit = 50

  [[http_service.checks]]
    grace_period = '20s'
    interval = '30s'
    method = 'GET'
    timeout = '5s'
    path = '/health'

[[vm]]
  # Мир считается двадцать раз в секунду, и зона занимает около мегабайта.
  # Гигабайта хватает с запасом на несколько комнат: замер под полусотней
  # игроков показал 113 МБ.
  size = 'shared-cpu-1x'
  memory = '1gb'
